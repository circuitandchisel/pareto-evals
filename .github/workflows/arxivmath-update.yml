name: Check ArXivMath editions

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arxivmath-edition-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          app-id: 5584695
          private-key: ${{ secrets.PARETO_RELEASE_BUMPER_APP_PRIVATE_KEY }}
          owner: circuitandchisel
          repositories: pareto-evals
      - name: Biweekly gate
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            echo "due=$(python scripts/update_arxivmath.py --check-due)" >> "$GITHUB_OUTPUT"
          fi
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Discover, validate and propose
        if: steps.cadence.outputs.due == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pending=$(gh pr list --state open --base main --limit 1000 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/arxivmath-"))] | length')
          if [ "$pending" != 0 ]; then
            echo 'An ArXivMath update PR is awaiting review; leaving it unchanged.'
            exit 0
          fi
          git pull --ff-only origin main
          python scripts/update_arxivmath.py --write
          if git diff --quiet -- arxivmath.json; then exit 0; fi
          python -m pip install 'datasets==3.6.0'
          python datasets/prepare_arxiv_math.py
          python -m compileall -q arxivmath_config.py scripts/update_arxivmath.py datasets/prepare_arxiv_math.py benchmarks/arxiv_math.py
          edition=$(python -c 'import json; print(json.load(open("arxivmath.json"))["edition"])')
          revision=$(python -c 'import json; print(json.load(open("arxivmath.json"))["revision"])')
          branch="automation/arxivmath-${edition}-${revision}"
          existing=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$existing" ]; then
            echo 'This exact update was already proposed; leaving its branch unchanged.'
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'pareto-evals-release-bumper[bot]'
          git config user.email '5584695+pareto-evals-release-bumper[bot]@users.noreply.github.com'
          git add arxivmath.json
          git commit -m "chore: update ArXivMath edition ${edition}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update ArXivMath ${edition} (${revision:0:8})" \
            --body "Updates the pinned official question dataset in arxivmath.json. The pinned dataset was downloaded and its question count, unique IDs, and nonempty problems/answers validated. No question contents are committed. See this workflow's log for the before/after manifest: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Manual review required: confirm edition, schema, license, question count and grading compatibility. No model inference was performed. This does not deploy to unbiased-analysis: update its engine/dataset pins, filename, question-count contracts and pricing assumptions in a separate reviewed release. Existing purchases must retain their original artifacts. This PR was opened as pareto-evals-release-bumper[bot]; its CI can run normally. No automatic merge."
